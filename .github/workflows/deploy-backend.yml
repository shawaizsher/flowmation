name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --production

      - name: Create startup script
        working-directory: backend
        run: |
          cat > startup.sh << 'EOF'
          #!/bin/bash
          # Install PM2 globally if not present
          npm install -g pm2 2>/dev/null || true
          # Start API server and worker with PM2
          pm2 start src/index.js --name flowa-api --no-daemon &
          pm2 start src/worker.js --name flowa-worker --no-daemon &
          wait
          EOF
          chmod +x startup.sh

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: flowa-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

      - name: Set App Service environment variables
        uses: azure/appservice-settings@v1
        with:
          app-name: flowa-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          app-settings-json: |
            [
              { "name": "NODE_ENV",          "value": "production" },
              { "name": "PORT",              "value": "4000" },
              { "name": "DB_SERVER",         "value": "${{ secrets.DB_SERVER }}" },
              { "name": "DB_DATABASE",       "value": "${{ secrets.DB_DATABASE }}" },
              { "name": "DB_USER",           "value": "${{ secrets.DB_USER }}" },
              { "name": "DB_PASSWORD",       "value": "${{ secrets.DB_PASSWORD }}" },
              { "name": "DB_ENCRYPT",        "value": "true" },
              { "name": "DB_TRUST_CERT",     "value": "false" },
              { "name": "REDIS_URL",         "value": "${{ secrets.REDIS_URL }}" },
              { "name": "JWT_SECRET",        "value": "${{ secrets.JWT_SECRET }}" },
              { "name": "ENCRYPTION_KEY",    "value": "${{ secrets.ENCRYPTION_KEY }}" },
              { "name": "CORS_ORIGIN",       "value": "${{ secrets.FRONTEND_URL }}" },
              { "name": "FRONTEND_URL",      "value": "${{ secrets.FRONTEND_URL }}" },
              { "name": "GROQ_API_KEY",      "value": "${{ secrets.GROQ_API_KEY }}" },
              { "name": "ANTHROPIC_API_KEY", "value": "${{ secrets.ANTHROPIC_API_KEY }}" },
              { "name": "OPENAI_API_KEY",    "value": "${{ secrets.OPENAI_API_KEY }}" },
              { "name": "SMTP_HOST",         "value": "smtp.gmail.com" },
              { "name": "SMTP_PORT",         "value": "587" },
              { "name": "SMTP_SECURE",       "value": "false" },
              { "name": "SMTP_USER",         "value": "${{ secrets.SMTP_USER }}" },
              { "name": "SMTP_PASS",         "value": "${{ secrets.SMTP_PASS }}" },
              { "name": "SMTP_FROM",         "value": "${{ secrets.SMTP_USER }}" },
              { "name": "WEBSITE_NODE_DEFAULT_VERSION", "value": "~20" },
              { "name": "SCM_DO_BUILD_DURING_DEPLOYMENT", "value": "false" }
            ]
