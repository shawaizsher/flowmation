# Docker Compose for pulling pre-built consolidated image from Docker Hub
# Usage:
#   DOCKER_USERNAME=yourusername VERSION=1.0.0 docker-compose -f docker-compose.pull.yml up -d
#   OR
#   DOCKER_USERNAME=yourusername docker-compose -f docker-compose.pull.yml up -d  (uses latest)

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fluxion-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-fluxion_db}
      POSTGRES_USER: ${DB_USER:-fluxion_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fluxion_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fluxion_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxion-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fluxion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxion-network
    restart: unless-stopped

  # Consolidated Backend + Frontend (single image from Docker Hub)
  app:
    image: ${DOCKER_USERNAME:-yourusername}/fluxion:${VERSION:-latest}
    container_name: fluxion-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-fluxion_user}:${DB_PASSWORD:-fluxion_password}@postgres:5432/${DB_NAME:-fluxion_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    ports:
      - "4000:4000"
      - "3000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fluxion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health/live', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fluxion-network:
    driver: bridge
