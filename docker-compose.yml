version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flowa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-flowa_db}
      POSTGRES_USER: ${DB_USER:-flowa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowa_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flowa_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowa-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flowa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowa-network

  # Consolidated Backend + Frontend (single image from Docker Hub)
  app:
    image: shawaizsher/flowa:1.0.0
    container_name: flowa-app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-flowa_user}:${DB_PASSWORD:-flowa_password}@postgres:5432/${DB_NAME:-flowa_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      API_PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
    ports:
      - "4000:4000"
      - "3000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - flowa-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  flowa-network:
    driver: bridge
